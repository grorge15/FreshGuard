[plugins."superpowers@openai-api-curated"]
enabled = true

[mcp_servers.unityMCP]
command = "uvx"
args = ["--offline", "--from", "mcpforunityserver==10.1.2", "mcp-for-unity", "--transport", "stdio"]
startup_timeout_sec = 60

[mcp_servers.unityMCP.env]
SystemRoot = "C:\\Windows"

[agents.goal]
description = "Bounded independent FreshGuard work; investigate, change, and verify within an assigned scope."
config_file = "agents/goal.toml"

[agents.plan]
description = "Prepare a persistent handoff plan when explicitly needed; do not implement."
config_file = "agents/plan.toml"

[agents.build]
description = "Execute one confirmed persistent Unity plan, resume unfinished steps, verify and report."
config_file = "agents/build.toml"
